name: Tools hrt-tool

on:
  push:
    branches:
      - main
      - "Recovery/Tools"
      - "feat/hrt-tool"
    paths:
      - "tools/hrt-tool/**"
      - ".github/workflows/tools-hrt-tool.yml"
  pull_request:
    paths:
      - "tools/hrt-tool/**"
      - ".github/workflows/tools-hrt-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # CMake builds the printer with `cargo build --offline`; a clean runner
      # has an empty registry, so fetch the locked dependencies first.
      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path tools/hrt-tool/rust/hrt-print/Cargo.toml

      - name: Configure
        run: cmake -S tools/hrt-tool -B tools/hrt-tool/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build tools/hrt-tool/build --parallel

      - name: Test
        run: ctest --test-dir tools/hrt-tool/build --output-on-failure

  windows-followup:
    name: Windows (follow-up, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The C/C++/Rust Windows build (MSVC + vcpkg for OpenSSL/libcurl) is
      # enabled in M4. This job is deliberately non-blocking in M1.
      - name: Placeholder
        run: echo "Windows build is enabled in M4; see tools/hrt-tool/README.md."
